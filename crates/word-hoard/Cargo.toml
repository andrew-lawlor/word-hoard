[package]
name = "word-hoard"
description = "Word Hoard command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "word-hoard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
hoard-core.workspace = true
hoard-kobo.workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
