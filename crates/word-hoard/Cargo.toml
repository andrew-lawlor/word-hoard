[package]
name = "word-hoard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collect and curate highlights, notes and vocabulary from your e-reader (Kobo and KOReader)"
homepage = "https://github.com/andrew-lawlor/word-hoard"

[dependencies]
hoard-core = { path = "../hoard-core" }
hoard-transcribe = { path = "../hoard-transcribe" }
chrono.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
pangocairo = "0.22"
# Cards are written as PNG.
cairo-rs = { version = "0.22", features = ["png"] }
# The page image is decoded here, not by glycin (its helper processes can fail in sandboxes).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
[package.metadata.deb]
name = "word-hoard"
maintainer = "Andrew Lawlor <andrew@lawlor.io>"
copyright = "2026, Andrew Lawlor <andrew@lawlor.io>"
license-file = ["../../LICENSE", "0"]
section = "text"
priority = "optional"
depends = "$auto"
extended-description = """\
Word Hoard imports highlights, notes, handwritten markups and looked-up words \
from a Kobo e-reader connected over USB, in its own reader or in KOReader, \
without writing to the device \
and without duplicates. Curate them in a GTK/libadwaita app, see each word's \
context sentence and an offline Wiktionary definition, and export to Obsidian, \
Anki, JSON, CSV or Readwise."""
assets = [
    ["target/release/word-hoard", "usr/bin/", "755"],
    ["target/release/word-hoard-cli", "usr/bin/", "755"],
    ["data/io.github.andrew_lawlor.WordHoard.desktop", "usr/share/applications/", "644"],
    ["data/io.github.andrew_lawlor.WordHoard.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/io.github.andrew_lawlor.WordHoard.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../data/dictionaries/wiktionary-en.db", "usr/share/word-hoard/dictionaries/", "644"],
    ["data/THIRD-PARTY.md", "usr/share/doc/word-hoard/", "644"],
    ["data/fonts/OFL.txt", "usr/share/doc/word-hoard/OFL-Literata.txt", "644"],
]
